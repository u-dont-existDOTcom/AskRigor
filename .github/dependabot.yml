version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    ignore:
      # The runtime is pinned to Node 24 (engines, .nvmrc, Docker images);
      # @types/node must track that major, not the latest Node release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # zod >= 4.5 changes generated JSON Schema (nullable -> anyOf, tuple
      # items:false), which alters the public MCP / Custom GPT / Gemini tool
      # schemas. Owner decision 2026-09-26: stay on 4.4.x until a release
      # window; patch updates still apply.
      - dependency-name: "zod"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(actions)
