name: TEMP advance Universal MCP manifest test

on:
  push:
    branches:
      - codex/research-before-reinvention-20-5-14

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out task branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: codex/research-before-reinvention-20-5-14
          persist-credentials: true

      - name: Advance exact Universal MCP manifest expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/mcp-tools.test.ts')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'version: "20.5.13",': 'version: "20.5.14",',
              'revisionDate: "2026-08-17",': 'revisionDate: "2026-08-18",',
              'sha256: "3bef54307403df2cbd459377bc308747db47310aefe68cac3b7b2b75c87f92c4"': 'sha256: "8f929aa70bc71d8528da3527a22704b0cf85ffec08e9b7b13a186ead71505221"',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one manifest test anchor for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

          git config user.name 'askrigor-protocol-bootstrap'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/mcp-tools.test.ts
          git diff --cached --quiet && { echo 'Expected MCP manifest test diff was not produced'; exit 1; }
          git commit -m 'test: advance Universal MCP manifest expectation'
          git push origin HEAD:codex/research-before-reinvention-20-5-14
