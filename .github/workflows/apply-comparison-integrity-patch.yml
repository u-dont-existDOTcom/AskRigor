name: Apply comparison-integrity protocol patch

on:
  push:
    branches:
      - logic-comparison-integrity-2026-09-08

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply comparison-integrity protocol lessons'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Apply canonical migration
        run: python3 scripts/protocol-migrations/2026-09-08-comparison-integrity.py

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocols/Universal_Instructions.xml protocols/HRP_Full.xml tests/protocol.test.ts README.md docs/logic-lessons-comparison-integrity-2026-09-08.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No protocol changes required"
            exit 0
          fi
          git commit -m "Apply comparison-integrity protocol lessons"
          git push origin HEAD
