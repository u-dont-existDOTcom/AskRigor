name: Apply recommendation preflight test pins

on:
  push:
    branches: [task/universal-recommendation-preflight-20260917]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Apply exact reviewed test-pin edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init work
          cd work
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD
          if grep -q 'c869d770ecc13280a40567ba382324e1d9a6b0af7c35165008781f186317d9b2' tests/mcp-tools.test.ts; then
            echo "Reviewed edits already applied."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          OLD_SHA="6f17c7285f383a71306cea46249e7eb45c3d5e890b10edd983e178ab6e173ef5"
          NEW_SHA="c869d770ecc13280a40567ba382324e1d9a6b0af7c35165008781f186317d9b2"
          def r(path, old, new, n=1):
              p=Path(path); s=p.read_text(); got=s.count(old)
              if got != n: raise SystemExit(f"{path}: expected {n}, found {got}: {old!r}")
              p.write_text(s.replace(old,new,n))

          for path in [
              "tests/epistemic-phase-routing.test.ts",
              "tests/explicit-commitment-obligation-structure.test.ts",
              "tests/interview-evidence-integrity.test.ts",
              "tests/longitudinal-evidence-preservation.test.ts",
              "tests/normality-base-rate-structure.test.ts",
              "tests/research-before-reinvention-structure.test.ts",
              "tests/whole-argument-reconstruction-structure.test.ts",
          ]:
              r(path,'20\\.5\\.25" revisionDate="2026-09-14','20\\.5\\.26" revisionDate="2026-09-17')

          r("tests/mcp-tools.test.ts",'version: "20.5.25"','version: "20.5.26"',3)
          r("tests/mcp-tools.test.ts",'revisionDate: "2026-09-14"','revisionDate: "2026-09-17"',2)
          r("tests/mcp-tools.test.ts",OLD_SHA,NEW_SHA,3)
          r("tests/protocol.test.ts",OLD_SHA,NEW_SHA)
          r("tests/protocol.test.ts",'version: "20.5.25",\n      revisionDate: "2026-09-14"','version: "20.5.26",\n      revisionDate: "2026-09-17"')
          r("tests/release-packet.test.ts","Universal Instructions `20.5.25`","Universal Instructions `20.5.26`")
          r("tests/release-packet.test.ts",OLD_SHA,NEW_SHA)
          r("tests/research-frontier-repository.test.ts",'version: "20.5.25",\n        revisionDate: "2026-09-14",\n        sha256: "'+OLD_SHA+'",','version: "20.5.26",\n        revisionDate: "2026-09-17",\n        sha256: "'+NEW_SHA+'",')

          p=Path("tests/reasoning-selection-structure.test.ts"); s=p.read_text()
          old='version="20\\.5\\.25" revisionDate="2026-09-14"'; new='version="20\\.5\\.26" revisionDate="2026-09-17"'
          if s.count(old)!=1: raise SystemExit("reasoning root pin mismatch")
          s=s.replace(old,new,1)
          marker="    const priorLongitudinalUniversal = universal"
          if s.count(marker)!=1: raise SystemExit("reasoning lineage marker mismatch")
          prefix='''    const priorRecommendationUniversal = universal\n      .replace('version="20.5.26" revisionDate="2026-09-17"', 'version="20.5.25" revisionDate="2026-09-14"')\n      .replace("Important-Task Optimization, Recommendation-Preflight Integrity, Approval", "Important-Task Optimization, Approval")\n      .replace(/<revision version="20\\.5\\.26" priority="Critical">[\\s\\S]*?<\\/revision>\\n/u, "")\n      .replace(/<recommendation_preflight_integrity_gate priority="Critical">[\\s\\S]*?<\\/recommendation_preflight_integrity_gate>\\n\\n/u, "")\n      .replace(/Recommendation-preflight check:[^\\n]*\\n\\n/u, "");\n    expect(sha256(priorRecommendationUniversal)).toBe(\n      "6f17c7285f383a71306cea46249e7eb45c3d5e890b10edd983e178ab6e173ef5",\n    );\n\n    const priorLongitudinalUniversal = priorRecommendationUniversal'''
          p.write_text(s.replace(marker,prefix,1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "Update Universal 20.5.26 test pins"
          git push origin HEAD:"${GITHUB_REF_NAME}"
