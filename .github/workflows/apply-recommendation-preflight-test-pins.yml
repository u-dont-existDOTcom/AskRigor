name: Apply recommendation preflight test pins

on:
  push:
    branches:
      - task/universal-recommendation-preflight-20260917

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Apply exact reviewed test-pin edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init work
          cd work
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD
          if grep -q 'c869d770ecc13280a40567ba382324e1d9a6b0af7c35165008781f186317d9b2' tests/mcp-tools.test.ts; then
            echo "Reviewed test-pin edits already applied."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path

          OLD_SHA = "6f17c7285f383a71306cea46249e7eb45c3d5e890b10edd983e178ab6e173ef5"
          NEW_SHA = "c869d770ecc13280a40567ba382324e1d9a6b0af7c35165008781f186317d9b2"

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              s = p.read_text()
              found = s.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrences of {old!r}, found {found}")
              p.write_text(s.replace(old, new, count))

          simple_regex_files = [
              "tests/epistemic-phase-routing.test.ts",
              "tests/explicit-commitment-obligation-structure.test.ts",
              "tests/interview-evidence-integrity.test.ts",
              "tests/longitudinal-evidence-preservation.test.ts",
              "tests/normality-base-rate-structure.test.ts",
              "tests/research-before-reinvention-structure.test.ts",
              "tests/whole-argument-reconstruction-structure.test.ts",
          ]
          for path in simple_regex_files:
              replace(path, '20\\.5\\.25" revisionDate="2026-09-14', '20\\.5\\.26" revisionDate="2026-09-17')

          replace("tests/mcp-tools.test.ts", 'version: "20.5.25"', 'version: "20.5.26"', 3)
          replace("tests/mcp-tools.test.ts", 'revisionDate: "2026-09-14"', 'revisionDate: "2026-09-17"', 2)
          replace("tests/mcp-tools.test.ts", OLD_SHA, NEW_SHA, 3)

          replace("tests/protocol.test.ts", OLD_SHA, NEW_SHA)
          replace(
              "tests/protocol.test.ts",
              'version: "20.5.25",\n      revisionDate: "2026-09-14"',
              'version: "20.5.26",\n      revisionDate: "2026-09-17"',
          )

          replace("tests/release-packet.test.ts", "Universal Instructions `20.5.25`", "Universal Instructions `20.5.26`")
          replace("tests/release-packet.test.ts", OLD_SHA, NEW_SHA)

          replace(
              "tests/research-frontier-repository.test.ts",
              'version: "20.5.25",\n        revisionDate: "2026-09-14",\n        sha256: "' + OLD_SHA + '",',
              'version: "20.5.26",\n        revisionDate: "2026-09-17",\n        sha256: "' + NEW_SHA + '",',
          )

          reasoning = Path("tests/reasoning-selection-structure.test.ts")
          s = reasoning.read_text()
          old_root = 'version="20\\.5\\.25" revisionDate="2026-09-14"'
          new_root = 'version="20\\.5\\.26" revisionDate="2026-09-17"'
          if s.count(old_root) != 1:
              raise SystemExit("reasoning-selection root pin mismatch")
          s = s.replace(old_root, new_root, 1)
          old_anchor = '''    const priorLongitudinalUniversal = universal
              .replace('version="20.5.25" revisionDate="2026-09-14"', 'version="20.5.24" revisionDate="2026-09-12"')'''
          new_anchor = '''    const priorRecommendationUniversal = universal
              .replace('version="20.5.26" revisionDate="2026-09-17"', 'version="20.5.25" revisionDate="2026-09-14"')
              .replace("Important-Task Optimization, Recommendation-Preflight Integrity, Approval", "Important-Task Optimization, Approval")
              .replace(/<revision version="20\\.5\\.26" priority="Critical">[\\s\\S]*?<\\/revision>\\n/u, "")
              .replace(/<recommendation_preflight_integrity_gate priority="Critical">[\\s\\S]*?<\\/recommendation_preflight_integrity_gate>\\n\\n/u, "")
              .replace(/Recommendation-preflight check:[^\\n]*\\n\\n/u, "");
            expect(sha256(priorRecommendationUniversal)).toBe(
              "6f17c7285f383a71306cea46249e7eb45c3d5e890b10edd983e178ab6e173ef5",
            );

            const priorLongitudinalUniversal = priorRecommendationUniversal
              .replace('version="20.5.25" revisionDate="2026-09-14"', 'version="20.5.24" revisionDate="2026-09-12"')'''
          if s.count(old_anchor) != 1:
              raise SystemExit("reasoning-selection historical anchor mismatch")
          reasoning.write_text(s.replace(old_anchor, new_anchor, 1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "Update Universal 20.5.26 test pins"
          git push origin HEAD:"${GITHUB_REF_NAME}"
