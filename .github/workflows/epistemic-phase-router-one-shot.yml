name: One-shot epistemic safeguards migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply canonical epistemic safeguards
        run: python scripts/protocol/apply_epistemic_phase_attractor_2026_08_24.py

      - name: Validate migration and targeted regression
        run: |
          python -m py_compile scripts/protocol/apply_epistemic_phase_attractor_2026_08_24.py
          npm ci
          npx vitest run tests/epistemic-phase-routing-structure.test.ts tests/protocol.test.ts
          git diff --check

      - name: Commit canonical patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/epistemic-phase-router-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add epistemic attractor and phase routing safeguards"
          git push origin HEAD:main
