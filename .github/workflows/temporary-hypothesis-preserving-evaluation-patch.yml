name: Temporary hypothesis-preserving protocol patch

on:
  push:
    branches:
      - task/hypothesis-preserving-evaluation-gate-20260907
    paths:
      - tasks/run-hypothesis-preserving-evaluation-patch

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: task/hypothesis-preserving-evaluation-gate-20260907
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact protocol patch
        run: node scripts/apply-hypothesis-preserving-evaluation-gate.mjs

      - name: Full deterministic verification
        run: npm run verify

      - name: Commit verified canonical changes and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-hypothesis-preserving-evaluation-gate.mjs
          rm -f .github/workflows/temporary-hypothesis-preserving-evaluation-patch.yml
          rm -f tasks/run-hypothesis-preserving-evaluation-patch
          git config user.name "askrigor-protocol-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "$(printf '%s\n' '.github/workflows/temporary-hypothesis-preserving-evaluation-patch.yml' 'protocols/HRP_Full.xml' 'protocols/Universal_Instructions.xml' 'scripts/apply-hypothesis-preserving-evaluation-gate.mjs' 'tasks/run-hypothesis-preserving-evaluation-patch' | sort | tr '\n' ' ')"
          git commit -m "protocols: add hypothesis-preserving evaluation gate"
          git push origin HEAD:task/hypothesis-preserving-evaluation-gate-20260907
