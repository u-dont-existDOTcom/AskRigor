name: Apply Universal target-preservation patch
on:
  push:
    branches:
      - task/universal-target-preservation-20260907
    paths:
      - scripts/protocol/apply_universal_20_5_15_to_20_5_16.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Apply fail-closed protocol patch
        run: python3 scripts/protocol/apply_universal_20_5_15_to_20_5_16.py protocols/Universal_Instructions.xml --in-place
      - name: Verify only intended protocol file changed
        run: |
          git diff --check
          test "$(git diff --name-only)" = "protocols/Universal_Instructions.xml"
      - name: Commit patched protocol
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocols/Universal_Instructions.xml
          git commit -m "Protocol: add target-preservation rule"
          git push
