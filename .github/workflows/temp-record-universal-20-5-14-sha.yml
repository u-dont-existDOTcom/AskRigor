name: TEMP record Universal 20.5.14 digest

on:
  push:
    branches:
      - codex/research-before-reinvention-20-5-14

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out task branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: codex/research-before-reinvention-20-5-14
          persist-credentials: true

      - name: Record exact generated protocol digest
        run: |
          mkdir -p docs/superpowers/plans
          sha256sum protocols/Universal_Instructions.xml | awk '{print $1}' > docs/superpowers/plans/2026-08-18-universal-20-5-14-sha256.txt
          git config user.name 'askrigor-protocol-bootstrap'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/plans/2026-08-18-universal-20-5-14-sha256.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: record Universal 20.5.14 digest'
          git push origin HEAD:codex/research-before-reinvention-20-5-14
