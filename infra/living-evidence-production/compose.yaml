services:
  research-mcp:
    image: ${ASKRIGOR_RESEARCH_IMAGE:?set exact reviewed AskRigor image}
    depends_on:
      living-evidence-postgres:
        condition: service_healthy
    networks:
      - default
      - living_evidence_private

  living-evidence-postgres:
    image: postgres:17.6-alpine@sha256:747d5ed1fdeeb124b880fbe3d7c6557d2c4064ae41d6b6297d417882effce4be
    user: "70:70"
    restart: unless-stopped
    environment:
      POSTGRES_DB: askrigor_living_evidence
      POSTGRES_USER: askrigor_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/living_evidence_migrator_password
      ASKRIGOR_READER_PASSWORD_FILE: /run/secrets/living_evidence_reader_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
    secrets:
      - living_evidence_migrator_password
      - living_evidence_reader_password
    volumes:
      - /opt/askrigor/state/living-evidence-postgres:/var/lib/postgresql/data
      - /opt/askrigor/living-evidence/init-reader.sh:/docker-entrypoint-initdb.d/001-askrigor-reader.sh:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m,uid=70,gid=70,mode=0755
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: []
    cpus: 0.50
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, pg_isready -U askrigor_migrator -d askrigor_living_evidence]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - living_evidence_private

  living-evidence-admin:
    profiles: [living-evidence-admin]
    image: ${ASKRIGOR_RESEARCH_IMAGE:?set exact reviewed AskRigor image}
    entrypoint: [node, apps/research-mcp/dist/living-evidence-admin.js]
    env_file:
      - /opt/askrigor/living-evidence-writer.env
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      living-evidence-postgres:
        condition: service_healthy
    networks:
      - living_evidence_private
    restart: "no"

secrets:
  living_evidence_migrator_password:
    file: /opt/askrigor/secrets/living-evidence-migrator-password
  living_evidence_reader_password:
    file: /opt/askrigor/secrets/living-evidence-reader-password

networks:
  living_evidence_private:
    internal: true
